name: GaelicTracker
options:
  bundleIdPrefix: com.gaelictracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GaelicTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GaelicTracker
        excludes:
          - "Preview Content/PreviewData.swift"
      - path: GaelicTracker/Preview Content/PreviewData.swift
        compilationCondition:
          config: Debug
    info:
      path: GaelicTracker/Info.plist
      properties:
        CFBundleDisplayName: GaelicTracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "GaelicTracker needs access to your photo library to add team crests."
        NSPhotoLibraryAddUsageDescription: "GaelicTracker saves share cards to your photo library so you can attach them when posting to X (Twitter)."
        LSApplicationQueriesSchemes:
          - twitter
          - instagram-stories
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelictracker.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GaelicTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GaelicTrackerTests
    dependencies:
      - target: GaelicTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelictracker.tests
